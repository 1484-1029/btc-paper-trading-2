name: BTC Auto Trade

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy lightgbm scikit-learn requests
          pip install pandas-ta --no-build-isolation || pip install git+https://github.com/twopirllc/pandas-ta.git@development

      - name: Run auto trade
        env:
          BITBANK_API_KEY: ${{ secrets.BITBANK_API_KEY }}
          BITBANK_API_SECRET: ${{ secrets.BITBANK_API_SECRET }}
        run: python auto_trade.py
